<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 迷你监控</title><link rel="stylesheet" href="/style.css"><script defer src="/gsap.js"></script><script defer src="/app.js"></script></head><body><main class="pulse-strip" aria-label="Codex迷你监控浮条"><span id="signal" class="signal" title="等待真实记录"></span><svg id="spark" viewBox="0 0 100 30" role="img" aria-label="速度小折线"><path id="trace"></path><circle id="point" r="2.5"></circle></svg><span class="reading" id="tokenReading"><small>Token</small><b id="total">—</b></span><span class="reading"><small>均速</small><b id="speed">—</b><small>/s</small></span><span class="reading" id="shortReading"><small>5h剩</small><b id="short">—</b></span><span class="reading" id="weekReading"><small>周剩</small><b id="week">—</b></span><button id="pin" title="请求宿主显示为小浮条" aria-label="显示为浮条">↗</button><button id="pause" title="暂停画面，继续采集" aria-label="暂停监控画面">Ⅱ</button></main><p id="placement" role="status">检测浮条模式…</p></body></html>
